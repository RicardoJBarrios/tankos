<section aria-labelledby="record-entry-title">
  <h2 id="record-entry-title">Registrar</h2>
  <p>Elige qué quieres dejar anotado.</p>

  <div class="record-entry-options">
    @for (option of options; track option.id) {
    <button
      mat-stroked-button
      type="button"
      class="record-entry-option"
      data-testid="record-entry-option"
      (click)="choose(option.route)"
    >
      <span class="option-label">{{ option.label }}</span>
      <span class="option-description">{{ option.description }}</span>
    </button>
    }
  </div>
</section>
