<form
  data-testid="unit-definition-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <label
    >Code
    <input
      data-testid="unit-code"
      formControlName="code"
      [readOnly]="record() !== undefined"
  /></label>
  <label
    >Symbol <input data-testid="unit-symbol" formControlName="symbol"
  /></label>
  <label
    >ASCII fallback
    <input data-testid="unit-ascii-fallback" formControlName="asciiFallback"
  /></label>
  <label
    >Position
    <select data-testid="unit-position" formControlName="position">
      <option value="suffix">After the value</option>
      <option value="prefix">Before the value</option>
    </select></label
  >
  <label
    >Spacing
    <select data-testid="unit-spacing" formControlName="spacing">
      <option value="narrow">With a space</option>
      <option value="normal">With normal spacing</option>
      <option value="none">Without a space</option>
    </select></label
  >
  <p>
    <span>Display example</span>
    <output data-testid="unit-display-preview">{{ displayPreview() }}</output>
  </p>
  <button data-testid="save-unit" type="submit">
    {{ record() ? 'Update' : 'Save' }}
  </button>
  @if (record()) {
    <button data-testid="cancel-unit" type="button" (click)="cancelled.emit()">
      Cancel
    </button>
  }
</form>
