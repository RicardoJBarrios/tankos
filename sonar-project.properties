sonar.projectKey=tankos
sonar.projectName=TankOS
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# TankOS is the active product scope.
sonar.sources=apps/tankos,libs
sonar.tests=apps/tankos/src,libs
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,reports/**,.nx/**,.angular/**
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/test-setup.ts
# Nx keeps one equivalent Vite/ESLint entrypoint per project. These build-tool
# manifests are not product code and must not distort duplication metrics.
sonar.cpd.exclusions=**/vite.config.mts,**/eslint.config.mjs
sonar.qualitygate.wait=true

# Vitest writes one LCOV report per Nx project. The local runner supplies the
# current report list to avoid stale reports from previous workspace layouts.
