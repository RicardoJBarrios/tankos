<mat-toolbar class="topbar" aria-label="TankOS navigation">
  <span class="brand">{{ title }}</span>
  <span class="toolbar-spacer"></span>
  <a mat-button routerLink="/units">Units</a>
  <button
    mat-button
    type="button"
    data-testid="logout"
    [disabled]="loggingOut()"
    (click)="logout()"
  >
    {{ loggingOut() ? 'Signing out…' : 'Sign out' }}
  </button>
</mat-toolbar>
<router-outlet />
<tankos-feedback-outlet />
