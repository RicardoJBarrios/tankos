[mcp_servers.nx-mcp]
command = "npx"
args = [ "nx", "mcp", "--minimal" ]

[mcp_servers.firebase]
command = "npx"
args = [ "-y", "firebase-tools@latest", "mcp", "--only", "developerknowledge" ]
cwd = "."

[mcp_servers.chrome-devtools]
command = "npx"
args = [ "-y", "chrome-devtools-mcp@latest" ]

[mcp_servers.github]
command = "/bin/zsh"
args = [ "-lc", "export GITHUB_PERSONAL_ACCESS_TOKEN=\"$(gh auth token)\"; exec github-mcp-server stdio --toolsets=repos,issues,pull_requests,actions,code_security,secret_protection" ]

[mcp_servers.codegraph]
command = "/opt/homebrew/bin/codegraph-mcp"
args = [ "--graph-only", "--workspace", "/Users/ricardo/Documents/github/veril", "--profile", "graph", "--exclude", "node_modules", "--exclude", "dist", "--exclude", ".nx", "--exclude", "coverage", "--exclude", ".git", "--exclude", "playwright-report", "--exclude", "test-results", "--exclude", ".codegraph", "--exclude", "*.log" ]

[mcp_servers.codegraph.env]
CODEGRAPH_TELEMETRY = "off"

[mcp_servers.sonarqube]
command = "/bin/zsh"
args = [ "-lc", "set -a; source .env; set +a; exec docker run --init --pull=always --rm -i -e SONARQUBE_TOKEN -e SONARQUBE_ORG -e SONARQUBE_TOOLSETS -e TELEMETRY_DISABLED mcp/sonarqube" ]
cwd = "."

[mcp_servers.sonarqube.env]
SONARQUBE_TOOLSETS = "analysis,issues,quality-gates,coverage,dependency-risks"
TELEMETRY_DISABLED = "true"

[features]
multi_agent = true

[agents.ci-monitor-subagent]
description = "CI helper for /monitor-ci. Fetches CI status, retrieves fix details, or updates self-healing fixes. Executes one MCP tool call and returns the result."
config_file = "agents/ci-monitor-subagent.toml"
