<section class="page-section" aria-labelledby="accept-invitation-title">
  <h2 id="accept-invitation-title">Aceptar invitación</h2>
  @if (state() === 'success') {
  <p role="status">{{ message() }}</p>
  } @else {
  <form data-testid="accept-invitation-form" (ngSubmit)="accept()">
    <label for="invitation-code">Código de invitación</label>
    <input
      id="invitation-code"
      data-testid="invitation-code"
      name="code"
      [ngModel]="code()"
      (ngModelChange)="code.set($event)"
      required
    />
    @if (state() === 'failure') {
    <p class="error" role="alert">{{ message() }}</p>
    }
    <button type="submit" [disabled]="state() === 'saving'">Aceptar</button>
  </form>
  }
  <a routerLink="/">Volver</a>
</section>
