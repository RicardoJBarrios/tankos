name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec nx format:check --base="remotes/origin/main"
      - run: pnpm exec nx run-many -t lint test build
      - run: pnpm exec firebase emulators:exec --project demo-veril --only auth,firestore "pnpm exec vitest run --config apps/veril/vitest.integration.config.ts"
      - run: pnpm exec nx e2e veril
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: apps/veril/test-results
          if-no-files-found: ignore
