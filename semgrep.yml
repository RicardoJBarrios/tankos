rules:
  - id: tankos-no-firebase-admin-in-browser
    languages:
      - typescript
      - javascript
    message: Browser-facing code must not import firebase-admin; keep admin access in the server adapter.
    severity: ERROR
    paths:
      include:
        - /apps/**/src/**
        - /libs/**/src/**
      exclude:
        - /apps/veril/src/app/**/infrastructure/fixtures/**
        - /libs/data-access-firestore-admin/**
        - /libs/data-access-server/**
    pattern-regex: 'from ["'']firebase-admin(?:/[^"'']*)?["'']'

  - id: tankos-no-private-key-literal
    languages:
      - typescript
      - javascript
    message: Do not commit private key material; use the repository secret store or local emulator configuration.
    severity: ERROR
    pattern-regex: '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
