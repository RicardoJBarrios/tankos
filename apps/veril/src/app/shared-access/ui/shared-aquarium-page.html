<section class="page-section" aria-labelledby="shared-aquarium-title">
  @if (state() === 'loading') {
  <p role="status">Cargando acuario…</p>
  } @else if (state() === 'failure') {
  <p class="error" role="alert">No tienes acceso a este acuario.</p>
  } @else if (aquarium(); as currentAquarium) {
  <p class="eyebrow">Acuario compartido · solo lectura</p>
  <h2 id="shared-aquarium-title">{{ currentAquarium.name }}</h2>
  <p>Solo se muestran las secciones para las que tienes permiso.</p>
  }
</section>
