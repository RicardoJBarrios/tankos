name: Veril checks

on:
  workflow_call:
    inputs:
      full:
        description: Run build, integration and E2E checks
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: 'pnpm'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .nx/cache
          key: veril-nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            veril-nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: inputs.full
        with:
          path: |
            ~/.cache/firebase/emulators
            ~/.cache/ms-playwright
          key: veril-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            veril-tools-${{ runner.os }}-
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: inputs.full
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm exec nx format:check --base="remotes/origin/${{ github.base_ref || 'main' }}"
      - run: pnpm exec nx run-many -t lint test
        if: ${{ !inputs.full }}

      - run: pnpm exec nx run-many -t lint test build
        if: inputs.full
      - run: pnpm exec playwright install --with-deps chromium
        if: inputs.full
      - run: pnpm exec firebase emulators:exec --project demo-veril --only auth,firestore "pnpm exec vitest run --config apps/veril/vitest.integration.config.ts"
        if: inputs.full
      - run: pnpm exec nx e2e veril
        if: inputs.full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.full && failure()
        with:
          name: playwright-artifacts
          path: apps/veril/test-results
          if-no-files-found: ignore
          retention-days: 7
