<section aria-labelledby="sign-in-title" class="page-section">
  <p class="eyebrow">Veril</p>
  <h2 id="sign-in-title">Iniciar sesión</h2>
  <mat-card appearance="outlined">
    <mat-card-content>
      @if (state() === 'success') {
      <p role="status" data-testid="sign-in-success">
        Sesión iniciada. Tus roles y permisos se han cargado.
      </p>
      } @else {
      <form data-testid="sign-in-form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            name="email"
            data-testid="sign-in-email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            required
          />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            name="password"
            data-testid="sign-in-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            required
          />
        </mat-form-field>
        @if (state() === 'failure') {
        <p class="error" role="alert">{{ errorMessage() }}</p>
        }
        <button
          mat-flat-button
          color="primary"
          type="submit"
          data-testid="sign-in-submit"
          [disabled]="state() === 'saving'"
        >
          {{ state() === 'saving' ? 'Iniciando sesión…' : 'Iniciar sesión' }}
        </button>
      </form>
      }
      <a mat-button routerLink="/">Volver</a>
    </mat-card-content>
  </mat-card>
</section>
